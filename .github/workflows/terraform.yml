name: Terraform

# Estrategia de deploy:
#
#   Pull Request     -> fmt + validate + plan. Nunca aplica.
#   push homolog     -> apply no workspace "homolog"
#   push main        -> apply no workspace "producao"
#   Run workflow     -> plan, apply ou destroy no ambiente escolhido
#
# Autenticacao por OIDC. Nenhuma credencial estatica da AWS neste repositorio.
#
# FILTRO DE CAMINHO: apply so dispara quando muda infraestrutura de verdade.
# Sem isso, corrigir uma linha do README na main ressuscitaria o cluster
# inteiro - o que atrapalha um projeto que sobe e desce o ambiente para
# economizar credito.
#
# ATENCAO AO TEMPO: criar um cluster EKS leva 10 a 15 minutos, mais o node
# group. A execucao pode passar de 20 minutos e parecer travada; e normal.

on:
  pull_request:
    branches: [homolog, main]
    paths:
      - '*.tf'
      - '*.tfvars'
      - '.terraform.lock.hcl'
      - '.github/workflows/terraform.yml'
  push:
    branches: [homolog, main]
    paths:
      - '*.tf'
      - '*.tfvars'
      - '.terraform.lock.hcl'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente alvo
        required: true
        type: choice
        options: [homolog, producao]
      acao:
        description: "plan (so mostra) | apply (cria) | destroy (derruba o cluster)"
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::266380777968:role/garageos-github-actions
  TF_VERSION: 1.15.7

# Serializa por AMBIENTE ALVO, nao por ref.
#
# Agrupar por `github.ref` era um erro: o check de um PR (refs/pull/N/merge) e
# o apply do merge (refs/heads/main) caem em grupos diferentes e rodam em
# paralelo - disputando o mesmo state no S3. Como o backend usa lock, um dos
# dois falha com "Error acquiring the state lock".
#
# Aqui um PR direcionado a main entra no mesmo grupo que um push na main,
# entao o segundo espera o primeiro terminar.
concurrency:
  group: terraform-${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ github.event_name == 'pull_request' && 'Validar' || 'Executar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # O environment `producao` e onde se configura required reviewers
    # (Settings > Environments). Com isso o apply em producao fica pendente,
    # esperando aprovacao, em vez de disparar sozinho.
    environment: ${{ github.event_name == 'pull_request' && 'validacao' || (github.ref_name == 'main' && 'producao' || 'homolog') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir contexto
        id: ctx
        run: |
          # Ambiente alvo
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            AMBIENTE="${{ inputs.ambiente }}"
          elif [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.base_ref }}" = "main" ]; then
            AMBIENTE="producao"
          else
            AMBIENTE="homolog"
          fi
          echo "env=$AMBIENTE" >> "$GITHUB_OUTPUT"

          # Vai aplicar? Push nas branches de deploy, ou acao manual "apply".
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.acao }}" = "apply" ]; then
            echo "aplicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "aplicar=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Ambiente: $AMBIENTE"

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          role-session-name: tf-k8s-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # ── Validacao ───────────────────────────────────────────────────────────

      - name: Formatacao
        run: terraform fmt -check -diff

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Selecionar workspace
        run: terraform workspace select -or-create "${{ steps.ctx.outputs.env }}"

      # ── Plan ────────────────────────────────────────────────────────────────

      - name: Plan
        if: inputs.acao != 'destroy'
        run: |
          terraform plan -input=false -no-color \
            -var-file="${{ steps.ctx.outputs.env }}.tfvars" \
            -out=tfplan

      - name: Resumo do plano
        if: inputs.acao != 'destroy'
        run: |
          {
            echo "### Terraform — ${{ steps.ctx.outputs.env }}"
            echo '```'
            terraform show -no-color tfplan | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Apply ───────────────────────────────────────────────────────────────

      - name: Apply
        if: steps.ctx.outputs.aplicar == 'true'
        run: terraform apply -input=false -auto-approve tfplan

      # Prova, com o kubectl, que o cluster subiu utilizavel - e nao apenas que
      # a API da AWS respondeu "created". Autentica pela mesma role do apply,
      # exercitando o Access Entry do CI de ponta a ponta.
      - name: Conferir o cluster
        if: steps.ctx.outputs.aplicar == 'true'
        run: |
          aws eks update-kubeconfig \
            --name "$(terraform output -raw cluster_name)" \
            --region "${{ env.AWS_REGION }}"

          echo "--- nos ---"
          kubectl get nodes -o wide

          echo "--- namespace ---"
          kubectl get namespace "$(terraform output -raw namespace)"

          echo "--- metrics-server ---"
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=180s

          echo "--- metricas ja disponiveis? ---"
          kubectl top nodes || echo "(metricas ainda agregando; normal nos primeiros minutos)"

      - name: Resumo do cluster
        if: steps.ctx.outputs.aplicar == 'true'
        run: |
          {
            echo "### Cluster provisionado — ${{ steps.ctx.outputs.env }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Cluster | \`$(terraform output -raw cluster_name)\` |"
            echo "| Kubernetes | \`$(terraform output -raw cluster_version)\` |"
            echo "| Namespace | \`$(terraform output -raw namespace)\` |"
            echo "| Acesso local | \`$(terraform output -raw configurar_kubectl)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Destroy manual ──────────────────────────────────────────────────────
      # O item mais importante para o orcamento: derruba o control plane, que
      # cobra ~US$ 0,10/hora esteja ou nao em uso.

      - name: Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.acao == 'destroy'
        run: |
          terraform destroy -input=false -auto-approve \
            -var-file="${{ steps.ctx.outputs.env }}.tfvars"
